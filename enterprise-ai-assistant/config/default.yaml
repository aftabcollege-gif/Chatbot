app:
  name: "دستیار هوشمند سازمانی"
  version: "1.0.0"
  language: "fa"
  theme: "dark"
  port: 8741
  host: "127.0.0.1"

llm:
  provider: "llamacpp"
  server_host: "127.0.0.1"
  server_port: 8742
  # Default lightweight model for 8GB systems; the desktop shells auto-select
  # the strongest model present (7B preferred when available).
  model_name: "qwen2.5-1.5b-instruct"
  model_path: "models/llm/qwen2.5-1.5b-instruct-q4_k_m.gguf"
  context_size: 4096
  temperature: 0.1
  # max_tokens must leave room for the prompt inside context_size.
  # 5 chunks x 512 tokens + system prompt ~= 2800 tokens of prompt, so
  # reserving 2048 for output overflowed the 4096 window and truncated the
  # answer mid-sentence.
  max_tokens: 900
  # Repetition control (llama.cpp defaults repeat_penalty to 1.0 = disabled,
  # which causes small models to loop the same phrase forever).
  repeat_penalty: 1.15
  frequency_penalty: 0.3
  presence_penalty: 0.3
  threads: 0
  gpu_layers: 0

embedding:
  model_path: "models/embedding"
  dimension: 1024
  batch_size: 16

reranker:
  model_path: "models/reranker"
  top_k: 5

rag:
  chunk_size: 512
  chunk_overlap: 50
  retrieval_top_k: 20
  reranker_top_k: 5
  # Must fit alongside the system prompt (~300 tok), the answer reservation
  # (llm.max_tokens) and any chat history, inside llm.context_size.
  #   2600 context + 900 output + ~300 system = 3800 < 4096
  context_max_tokens: 2600
  chat_history_max_tokens: 400
  min_confidence: 0.3

ocr:
  provider: "tesseract"
  languages: ["fa", "en"]

auth:
  jwt_secret: "CHANGE_THIS_ON_FIRST_RUN"
  jwt_refresh_secret: "CHANGE_THIS_ON_FIRST_RUN"
  jwt_expiry_minutes: 60
  jwt_refresh_days: 7
  max_login_attempts: 5
  lockout_minutes: 15

storage:
  max_file_size_mb: 100
  allowed_types:
    - pdf
    - docx
    - xlsx
    - pptx
    - txt
    - md
    - csv
    - html
    - json
    - xml
    - odt
    - epub

database:
  path: ""

backup:
  enabled: true
  max_backups: 10
  auto_backup_on_startup: true
